name: Build FFZ Panel (Theos)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # Manually trigger from GitHub UI

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      # Step 1: Checkout code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Select Xcode (ensure iOS SDK is available)
      - name: 🛠 Select Xcode
        run: |
          # Try latest Xcode first, fall back to older versions
          for VER in 16.2 16.1 16.0 15.4 15.3 15.2; do
            XCODE_PATH="/Applications/Xcode_$VER.app/Contents/Developer"
            if [ -d "$XCODE_PATH" ]; then
              sudo xcode-select -s "$XCODE_PATH"
              echo "Selected Xcode $VER"
              xcode-select -p
              break
            fi
          done
          xcodebuild -version 2>/dev/null || echo "Warning: xcodebuild not found"

      # Step 3: Install Theos
      - name: 🔧 Install Theos (iOS Tweak Build System)
        run: |
          export THEOS="$HOME/theos"
          sudo mkdir -p "$THEOS"
          sudo chown -R $(whoami) "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      # Step 4: Install ldid
      - name: 🔑 Install ldid
        run: |
          if ! command -v ldid &>/dev/null; then
            brew install ldid
          fi
          which ldid

      # Step 5: Install dpkg
      - name: 📦 Install dpkg
        run: |
          if ! command -v dpkg-deb &>/dev/null; then
            brew install dpkg
          fi

      # Step 6: Detect iOS SDK & Build
      - name: 🏗 Detect SDK & Build Tweak
        run: |
          export THEOS="$HOME/theos"
          
          # List all available iOS SDKs
          echo "=== Available iPhoneOS SDKs ==="
          ls -1 /Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/ 2>/dev/null || \
          ls -1 $(xcrun --show-sdk-path 2>/dev/null | sed 's|/[^/]*$||') 2>/dev/null || \
          echo "No SDK directories found"
          
          # Get the actual iOS SDK version from the SDK path
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          echo "SDK path: $SDK_PATH"
          
          if [ -n "$SDK_PATH" ]; then
            # Extract version from path like .../iPhoneOS18.2.sdk
            SDK_VER=$(echo "$SDK_PATH" | sed 's/.*iPhoneOS\(.*\)\.sdk/\1/')
            echo "Detected iOS SDK version: $SDK_VER"
          else
            # Fallback: find the SDK directory manually
            SDK_DIR=$(ls /Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS*.sdk 2>/dev/null | head -1)
            if [ -n "$SDK_DIR" ]; then
              SDK_VER=$(echo "$SDK_DIR" | sed 's/.*iPhoneOS\(.*\)\.sdk/\1/')
              echo "Detected iOS SDK version (fallback): $SDK_VER"
            else
              SDK_VER="latest"
              echo "Could not detect SDK, using: latest"
            fi
          fi
          
          # Fail early if no SDK detected
          if [ -z "$SDK_VER" ] || [ "$SDK_VER" = "latest" ]; then
            echo "::error::No iOS SDK found on this runner! Cannot build."
            exit 1
          fi
          
          # Build with detected SDK
          echo "=== Building with TARGET=iphone:clang:15.0:$SDK_VER ==="
          make clean package FINALPACKAGE=1 TARGET="iphone:clang:15.0:$SDK_VER"

      # Step 7: List build output
      - name: 📂 List Output Files
        run: |
          echo "=== packages output ==="
          find packages -type f -name "*.deb" 2>/dev/null | head -10
          echo ""
          echo "=== All .deb files ==="
          find . -name "*.deb" 2>/dev/null
          echo ""
          echo "=== .dylib files ==="
          find . -name "*.dylib" 2>/dev/null | head -10

      # Step 8: Upload .deb package
      - name: 📤 Upload .deb Package
        uses: actions/upload-artifact@v4
        with:
          name: ffz-panel-deb
          path: |
            packages/*.deb
            *.deb
          if-no-files-found: warn

      # Step 9: Upload .dylib
      - name: 📤 Upload .dylib
        uses: actions/upload-artifact@v4
        with:
          name: ffz-dylib
          path: |
            .theos/obj/ffz.dylib
            .theos/obj/arm64/ffz.dylib
          if-no-files-found: warn

      # Step 10: Upload plist
      - name: 📤 Upload plist
        uses: actions/upload-artifact@v4
        with:
          name: ffz-plist
          path: ffz.plist
          if-no-files-found: warn

  # Optional: Create a release when tag is pushed
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: 🏷 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ffz-panel-deb/*.deb
            ffz-dylib/*.dylib
            ffz-plist/ffz.plist
          generate_release_notes: true
