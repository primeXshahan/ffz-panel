name: Build FFZ Panel (Theos)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # Manually trigger from GitHub UI

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      # Step 1: Checkout code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Setup Xcode and detect latest iOS SDK
      - name: 🛠 Setup Xcode & Detect iOS SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer 2>/dev/null || \
          echo "Using default Xcode"
          xcodebuild -version
          # Find latest iOS SDK version
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "")
          echo "Available iOS SDK: $IOS_SDK"
          echo "IOS_SDK=$IOS_SDK" >> $GITHUB_ENV

      # Step 3: Install Theos
      - name: 🔧 Install Theos (iOS Tweak Build System)
        run: |
          export THEOS="$HOME/theos"
          sudo mkdir -p "$THEOS"
          sudo chown -R $(whoami) "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      # Step 4: Install ldid (code signing tool)
      - name: 🔑 Install ldid
        run: |
          if ! command -v ldid &>/dev/null; then
            brew install ldid
          fi
          which ldid

      # Step 5: Install dpkg (for .deb packaging)
      - name: 📦 Install dpkg
        run: |
          if ! command -v dpkg-deb &>/dev/null; then
            brew install dpkg
          fi

      # Step 6: Build the tweak (auto-detect SDK)
      - name: 🏗 Build Tweak (make clean package)
        run: |
          export THEOS="$HOME/theos"
          IOS_SDK="${{ env.IOS_SDK }}"
          if [ -z "$IOS_SDK" ]; then
            echo "No iOS SDK detected, trying to find one..."
            IOS_SDK=$(ls /Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/ 2>/dev/null | head -1 | sed 's/.*iPhoneOS\(.*\).sdk/\1/')
          fi
          if [ -n "$IOS_SDK" ]; then
            echo "Building with iOS SDK: $IOS_SDK"
            make clean package FINALPACKAGE=1 TARGET="iphone:clang:15.0:$IOS_SDK"
          else
            echo "No iOS SDK found, trying without SDK version..."
            make clean package FINALPACKAGE=1 TARGET="iphone:clang:15.0:latest"
          fi

      # Step 7: List build output
      - name: 📂 List Output Files
        run: |
          echo "=== .theos output ==="
          find .theos -type f -name "*.deb" -o -name "*.dylib" 2>/dev/null | head -20
          echo "=== packages output ==="
          find packages -type f -name "*.deb" 2>/dev/null | head -10
          echo ""
          echo "=== All .deb files ==="
          find . -name "*.deb" 2>/dev/null

      # Step 8: Upload .deb package as artifact
      - name: 📤 Upload .deb Package
        uses: actions/upload-artifact@v4
        with:
          name: ffz-panel-deb
          path: |
            packages/*.deb
            *.deb
          if-no-files-found: warn

      # Step 9: Upload .dylib as artifact (for sideloading)
      - name: 📤 Upload .dylib
        uses: actions/upload-artifact@v4
        with:
          name: ffz-dylib
          path: |
            .theos/obj/ffz.dylib
            .theos/obj/arm64/ffz.dylib
          if-no-files-found: warn

      # Step 10: Upload the .plist (needed for sideloading)
      - name: 📤 Upload plist
        uses: actions/upload-artifact@v4
        with:
          name: ffz-plist
          path: ffz.plist
          if-no-files-found: warn

  # Optional: Create a release when tag is pushed
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: 🏷 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ffz-panel-deb/*.deb
            ffz-dylib/*.dylib
            ffz-plist/ffz.plist
          generate_release_notes: true
