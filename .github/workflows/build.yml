name: Build FFZ Panel (Theos)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # Manually trigger from GitHub UI

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      # Step 1: Checkout code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Select Xcode (ensure iOS SDK is available)
      - name: 🛠 Select Xcode
        run: |
          # Try latest Xcode first, fall back to older versions
          for VER in 16.2 16.1 16.0 15.4 15.3 15.2; do
            XCODE_PATH="/Applications/Xcode_$VER.app/Contents/Developer"
            if [ -d "$XCODE_PATH" ]; then
              sudo xcode-select -s "$XCODE_PATH"
              echo "Selected Xcode $VER"
              xcode-select -p
              break
            fi
          done
          xcodebuild -version 2>/dev/null || echo "Warning: xcodebuild not found"

      # Step 3: Install Theos
      - name: 🔧 Install Theos (iOS Tweak Build System)
        run: |
          export THEOS="$HOME/theos"
          sudo mkdir -p "$THEOS"
          sudo chown -R $(whoami) "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      # Step 4: Install ldid
      - name: 🔑 Install ldid
        run: |
          if ! command -v ldid &>/dev/null; then
            brew install ldid
          fi
          which ldid

      # Step 5: Install dpkg
      - name: 📦 Install dpkg
        run: |
          if ! command -v dpkg-deb &>/dev/null; then
            brew install dpkg
          fi

      # Step 6: Build Tweak (Makefile auto-detects SDK)
      - name: 🏗 Build Tweak
        run: |
          export THEOS="$HOME/theos"
          echo "=== Building with auto-detected SDK ==="
          make clean package FINALPACKAGE=1

      # Step 7: List build output
      - name: 📂 List Output Files
        run: |
          echo "=== packages output ==="
          find packages -type f -name "*.deb" 2>/dev/null | head -10
          echo ""
          echo "=== All .deb files ==="
          find . -name "*.deb" 2>/dev/null
          echo ""
          echo "=== .dylib files ==="
          find . -name "*.dylib" 2>/dev/null | head -10

      # Step 8: Upload .deb package
      - name: 📤 Upload .deb Package
        uses: actions/upload-artifact@v4
        with:
          name: ffz-panel-deb
          path: |
            packages/*.deb
            *.deb
          if-no-files-found: warn

      # Step 9: Upload .dylib
      - name: 📤 Upload .dylib
        uses: actions/upload-artifact@v4
        with:
          name: ffz-dylib
          path: |
            .theos/obj/ffz.dylib
            .theos/obj/arm64/ffz.dylib
          if-no-files-found: warn

      # Step 10: Upload plist
      - name: 📤 Upload plist
        uses: actions/upload-artifact@v4
        with:
          name: ffz-plist
          path: ffz.plist
          if-no-files-found: warn

  # Optional: Create a release when tag is pushed
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: 🏷 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ffz-panel-deb/*.deb
            ffz-dylib/*.dylib
            ffz-plist/ffz.plist
          generate_release_notes: true
